/* --- Typography: Headers --- */

.columns {

  margin-top: 12px;
}
.embed-frame iframe {
  display: block;
  width: 100%;
  height: 560px;
  border: 0;
}

/* --- Paragraph body text on content slides --- */
section p {
  line-height: 1.45;

}

.embed-caption {
  font-size: 14px;

  font-family: 'Helvetica Neue', sans-serif;

  width: 100%;
}

<h1 id="accessible-fetch-states">Accessible Fetch States</h1>
<p>Waiting UI is an inclusion surface. Spinners that exist only as visual motion fail users who rely on screen readers unless status is exposed through live regions or text; reduced-motion preferences reject decorative loops; timeouts without recoverable messaging strand people on slow networks. Treat loading, empty, and error as first-class accessible states — not afterthoughts once the happy path looks finished.</p>

  border-top: 1px solid #C5A059; /* Gold accent line */
  padding-top: 20px;
  line-height: 1.1;
}

  font-size: 42px;
  color: #C5A059; /* Gold accent */
  border-bottom: 1px solid #333;
  padding-bottom: 10px;
}

h3 {
  font-size: 32px;
  color: #ffffff;
  font-style: italic;
}

/* --- Text Elements --- */
strong {
  color: #C5A059;
  font-family: 'Times New Roman', Times, serif;
  font-weight: bold;
}

a {
  color: #C5A059;
  text-decoration: none;
  border-bottom: 1px dotted #C5A059;
}

code {
  font-family: 'Courier New', Courier, monospace;
  background: #1a1a1a;
  color: #C5A059;
  padding: 2px 6px;
  border-radius: 2px;
  border: 1px solid #333;
}

blockquote {
  border-left: 3px solid #C5A059;
  padding-left: 20px;
  font-family: 'Times New Roman', Times, serif;
  font-style: italic;
  color: #bbbbbb;
  background: transparent;
}

/* --- Layout &amp; Utilities --- */
.columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
}

.caption {
  font-size: 14px;
  color: #666;
  font-family: 'Helvetica Neue', sans-serif;
  margin-top: 10px;
  text-align: center;
}


/* --- Background image slides: keep text readable on left --- */
section[data-marpit-advanced-background=&quot;background&quot;] {

}

  background: #ffffff;
  border-radius: 4px;
  overflow: hidden;
  margin-top: 12px;
}
.embed-frame iframe {
  display: block;
  width: 100%;
  height: 560px;
  border: 0;
}

/* --- Paragraph body text on content slides --- */
section p {
  line-height: 1.45;
  font-size: 22px;
  margin-top: 0.35em;
}

.embed-caption {
  font-size: 14px;
  color: #888;
  margin-top: 8px;
}

/* --- Footer Styling --- */
footer {
  font-family: 'Helvetica Neue', sans-serif;
  font-size: 14px;
  color: #444;
  position: absolute;
  bottom: 20px;
  width: 100%;
}
